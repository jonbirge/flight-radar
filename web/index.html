<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Flight Radar</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap">
  <link rel="stylesheet" href="../vendor/cesium/Build/Cesium/Widgets/widgets.css?v=2.9.17">
  <link rel="stylesheet" href="../shared/styles.css?v=2.9.17">
  <link rel="stylesheet" href="styles.css?v=2.9.17">
  <script src="../vendor/cesium/Build/Cesium/Cesium.js?v=2.9.17"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="hud-stats">
      <span id="clock"></span>
      <span class="hud-sep">|</span>
      <span>Tracks: <span id="track-count">0</span></span>
      <span class="hud-sep">|</span>
      <span>Updated: <span id="last-update">--:--:--</span></span>
      <span class="hud-sep">|</span>
      <span><span id="center-lat">--</span>, <span id="center-lon">--</span></span>
      <span class="hud-sep">|</span>
      <span>Alt: <span id="camera-alt">--</span></span>
    </div>
  </div>
  <div id="throttle-warning" class="hidden">API rate limited — displaying last known positions</div>

  <div id="hud-instructions">
    <div>Ctrl + drag to change perspective.</div>
    <div>Scroll to zoom, drag to pan.</div>
  </div>

  <!-- Controls panel -->
  <div id="controls">
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-aircraft">
        <span>Aircraft</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-labels" checked disabled>
        <span>Data blocks</span>
      </label>
      <div class="map-layer-select" id="map-layer">
        <button class="map-layer-btn" type="button">
          <span class="map-layer-label">CartoDB</span>
          <svg class="map-layer-chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="map-layer-menu">
          <div class="map-layer-option selected" data-value="carto">CartoDB</div>
          <div class="map-layer-option" data-value="satellite">Satellite</div>
          <div class="map-layer-option" data-value="osm">OpenStreetMap</div>
          <div class="map-layer-option" data-value="topo">Topographic</div>
          <div class="map-layer-option" data-value="night">Night Lights</div>
          <div class="map-layer-option" data-value="sectional">FAA Sectional</div>
          <div class="map-layer-option" data-value="terminal">FAA Terminal</div>
          <div class="map-layer-option" data-value="ifrLow">FAA IFR Low</div>
          <div class="map-layer-option" data-value="ifrHigh">FAA IFR High</div>
        </div>
      </div>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-rotate">
        <span>Auto rotate</span>
      </label>
    </div>
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-radar">
        <span>Radar</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-sigmets">
        <span>SIGMETs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-airmets">
        <span>AIRMETs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-pireps">
        <span>PIREPs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-turb-forecast">
        <span>Turb forecast</span>
      </label>
    </div>
    <div class="control-group">
      <button id="btn-north" class="scope-btn">North up</button>
      <button id="btn-conus" class="scope-btn">CONUS</button>
      <div class="scope-btn-group">
        <button id="btn-2d" class="scope-btn">2D</button>
        <button id="btn-3d" class="scope-btn active">3D</button>
      </div>
      <button id="btn-settings" class="scope-btn">Settings</button>
    </div>
  </div>

  <!-- Context menu -->
  <div id="context-menu" class="hidden">
    <ul id="context-menu-list"></ul>
  </div>

  <!-- Search panel -->
  <div id="search-panel">
    <input type="text" id="flight-search" placeholder="Flight # (e.g. UAL123)" autocomplete="off" spellcheck="false">
    <button id="btn-flight-search" class="scope-btn">Search</button>
  </div>

  <!-- Selected aircraft info panel -->
  <div id="aircraft-info" class="hidden">
    <button id="info-close" class="scope-btn">&times;</button>
    <div id="info-callsign">---</div>
    <div id="info-details"></div>
    <div id="info-buttons" class="hidden">
      <button id="btn-track" class="scope-btn">Track</button>
      <button id="btn-show-route" class="scope-btn">Show Route</button>
    </div>
  </div>

  <!-- Settings Modal (web-specific shell; form injected by shared/settings.js) -->
  <div id="settings-overlay">
    <div id="settings-panel">
      <div id="settings-header">
        <span>Preferences</span>
        <button id="settings-close" class="scope-btn">&times;</button>
      </div>
      <div id="settings-container"></div>
    </div>
  </div>

  <!-- Shared modules -->
  <script src="../shared/defaults.js?v=2.9.17"></script>
  <script src="../shared/config.js?v=2.9.17"></script>
  <script src="../shared/data.js?v=2.9.17"></script>
  <script src="../shared/icons.js?v=2.9.17"></script>
  <script src="../shared/settings.js?v=2.9.17"></script>
  <script src="../shared/radar-core.js?v=2.9.17"></script>
  <script src="../shared/radar-weather.js?v=2.9.17"></script>
  <script src="../shared/radar-markers.js?v=2.9.17"></script>
  <script src="../shared/radar-aircraft.js?v=2.9.17"></script>
  <script src="../shared/radar-ui.js?v=2.9.17"></script>
  <script src="../shared/radar-flightplan.js?v=2.9.17"></script>
  <script src="../shared/radar.js?v=2.9.17"></script>
  <!-- Web-specific (API shim + settings panel + init) -->
  <script src="app.js?v=2.9.17"></script>
</body>
</html>
