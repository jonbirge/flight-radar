<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Flight Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap">
  <link rel="stylesheet" href="../vendor/cesium/Build/Cesium/Widgets/widgets.css?v=2.2.0">
  <link rel="stylesheet" href="../shared/styles.css?v=2.2.0">
  <link rel="stylesheet" href="styles.css?v=2.2.0">
  <script src="../vendor/cesium/Build/Cesium/Cesium.js?v=2.2.0"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- HUD overlay -->
  <span id="clock"></span>
  <div id="hud">
    <div id="hud-stats">
      <span>Tracks: <span id="track-count">0</span></span>
      <span>Updated: <span id="last-update">--:--:--</span></span>
      <span>Lat: <span id="center-lat">--</span></span>
      <span>Lon: <span id="center-lon">--</span></span>
    </div>
    <div id="throttle-warning" class="hidden">API rate limited — displaying last known positions</div>
  </div>

  <div id="hud-instructions">
    <div>Ctrl + drag to change perspective.</div>
    <div>Scroll to zoom, drag to pan.</div>
  </div>

  <!-- Controls panel -->
  <div id="controls">
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-aircraft">
        <span>Aircraft</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-labels" checked disabled>
        <span>Data blocks</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-radar">
        <span>Radar</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-sigmets">
        <span>SIGMETs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-airmets">
        <span>AIRMETs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-pireps">
        <span>PIREPs</span>
      </label>
    </div>
    <div class="control-group">
      <label class="range-label">
        Poll interval
        <select id="poll-interval">
          <option value="10">10s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </label>
      <label class="range-label">
        Map
        <select id="map-layer">
          <option value="carto">CartoDB</option>
          <option value="satellite">Satellite</option>
          <option value="osm">OpenStreetMap</option>
          <option value="topo">Topographic</option>
          <option value="night">Night Lights</option>
          <option value="sectional">FAA Sectional</option>
          <option value="terminal">FAA Terminal</option>
          <option value="ifrLow">FAA IFR Low</option>
          <option value="ifrHigh">FAA IFR High</option>
        </select>
      </label>
      <label class="range-label">
        Turb forecast
        <select id="turb-level">
          <option value="none" selected>None</option>
          <option value="100">FL100</option>
          <option value="130">FL130</option>
          <option value="160">FL160</option>
          <option value="180">FL180</option>
          <option value="210">FL210</option>
          <option value="240">FL240</option>
          <option value="270">FL270</option>
          <option value="300">FL300</option>
          <option value="330">FL330</option>
          <option value="360">FL360</option>
          <option value="390">FL390</option>
          <option value="420">FL420</option>
          <option value="450">FL450</option>
          <option value="maxa">MAX (HI)</option>
          <option value="maxb">MAX (LO)</option>
        </select>
      </label>
    </div>
    <div class="control-group">
      <button id="btn-home" class="scope-btn">Home</button>
      <button id="btn-save-view" class="scope-btn">Save view</button>
      <button id="btn-north" class="scope-btn">North up</button>
      <button id="btn-conus" class="scope-btn">CONUS</button>
      <button id="btn-2d" class="scope-btn">2D</button>
      <button id="btn-3d" class="scope-btn active">3D</button>
      <button id="btn-rotate" class="scope-btn">Rotate</button>
      <button id="btn-settings" class="scope-btn">Settings</button>
    </div>
    <div class="control-group">
      <input type="text" id="flight-search" placeholder="Flight # (e.g. UAL123)" autocomplete="off" spellcheck="false">
      <button id="btn-flight-search" class="scope-btn">Search</button>
      <button id="btn-clear-route" class="scope-btn hidden">Clear</button>
    </div>
  </div>

  <!-- Selected aircraft info panel -->
  <div id="aircraft-info" class="hidden">
    <div id="info-close">&times;</div>
    <div id="info-callsign">---</div>
    <div id="info-details"></div>
  </div>

  <!-- Settings Modal (web-specific shell; form injected by shared/settings.js) -->
  <div id="settings-overlay">
    <div id="settings-panel">
      <div id="settings-header">
        <span>Preferences</span>
        <span id="settings-close">&times;</span>
      </div>
      <div id="settings-container"></div>
    </div>
  </div>

  <!-- Shared modules -->
  <script src="../shared/defaults.js?v=2.2.0"></script>
  <script src="../shared/config.js?v=2.2.0"></script>
  <script src="../shared/data.js?v=2.2.0"></script>
  <script src="../shared/icons.js?v=2.2.0"></script>
  <script src="../shared/settings.js?v=2.2.0"></script>
  <script src="../shared/radar.js?v=2.2.0"></script>
  <!-- Web-specific (API shim + settings panel + init) -->
  <script src="app.js?v=2.2.0"></script>
</body>
</html>
