<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Flight Radar</title>
  <link rel="stylesheet" href="../vendor/cesium/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../vendor/cesium/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- HUD overlay - FAA scope aesthetic -->
  <span id="clock"></span>
  <div id="hud">
    <div id="hud-stats">
      <span>TRKS: <span id="track-count">0</span></span>
      <span>UPD: <span id="last-update">--:--:--</span></span>
      <span>LAT: <span id="center-lat">--</span></span>
      <span>LON: <span id="center-lon">--</span></span>
    </div>
    <div id="throttle-warning" class="hidden">API RATE LIMITED — DISPLAYING LAST KNOWN POSITIONS</div>
  </div>

  <div id="hud-instructions">
    <div>Ctrl + drag to change perspective.</div>
    <div>Scroll to zoom, drag to pan.</div>
  </div>

  <!-- Controls panel -->
  <div id="controls">
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-aircraft">
        <span>AIRCRAFT</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-labels" checked disabled>
        <span>DATA BLOCKS</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-airports" checked>
        <span>AIRPORTS</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-airspace" checked>
        <span>AIRSPACE</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-navaids">
        <span>NAVAIDS</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-radar">
        <span>RADAR</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-turbulence">
        <span>TURB</span>
      </label>
    </div>
    <div class="control-group">
      <label class="range-label">
        POLL INTERVAL
        <select id="poll-interval">
          <option value="10">10s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </label>
      <label class="range-label">
        MAP
        <select id="map-layer">
          <option value="carto">CartoDB</option>
          <option value="sectional">VFR Sectional</option>
          <option value="terminal">VFR Terminal</option>
          <option value="ifrLow">IFR Low</option>
          <option value="ifrHigh">IFR High</option>
        </select>
      </label>
      <label class="range-label">
        TURB FORECAST
        <select id="turb-level">
          <option value="none" selected>None</option>
          <option value="100">FL100</option>
          <option value="130">FL130</option>
          <option value="160">FL160</option>
          <option value="180">FL180</option>
          <option value="210">FL210</option>
          <option value="240">FL240</option>
          <option value="270">FL270</option>
          <option value="300">FL300</option>
          <option value="330">FL330</option>
          <option value="360">FL360</option>
          <option value="390">FL390</option>
          <option value="420">FL420</option>
          <option value="450">FL450</option>
          <option value="maxa">MAX (HI)</option>
          <option value="maxb">MAX (LO)</option>
        </select>
      </label>
    </div>
    <div class="control-group">
      <button id="btn-home" class="scope-btn">HOME</button>
      <button id="btn-save-view" class="scope-btn">SAVE VIEW</button>
      <button id="btn-conus" class="scope-btn">CONUS</button>
      <button id="btn-2d" class="scope-btn">2D</button>
      <button id="btn-3d" class="scope-btn active">3D</button>
      <button id="btn-rotate" class="scope-btn">ROTATE</button>
      <button id="btn-settings" class="scope-btn">SETTINGS</button>
    </div>
  </div>

  <!-- Selected aircraft info panel -->
  <div id="aircraft-info" class="hidden">
    <div id="info-close">&times;</div>
    <div id="info-callsign">---</div>
    <div id="info-details"></div>
  </div>

  <!-- Shared modules -->
  <script src="../shared/defaults.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/data.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/radar.js"></script>
  <!-- Electron-specific -->
  <script src="renderer.js"></script>
</body>
</html>
