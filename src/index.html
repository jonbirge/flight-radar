<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Flight Radar</title>
  <link rel="stylesheet" href="../vendor/cesium/Build/Cesium/Widgets/widgets.css">
  <style>
    @font-face {
      font-family: 'Roboto Flex';
      font-style: normal;
      font-weight: 100 1000;
      font-display: swap;
      src: url('../vendor/fonts/roboto-flex.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
      src: url('../vendor/fonts/jetbrains-mono.woff2') format('woff2');
    }
  </style>
  <link rel="stylesheet" href="./styles.css">
  <script src="../vendor/cesium/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="hud-stats">
      <span id="clock"></span>
      <span class="hud-sep">|</span>
      <span>Tracks: <span id="track-count">0</span></span>
      <span class="hud-sep">|</span>
      <span>Updated: <span id="last-update">--:--:--</span></span>
      <span id="hud-diagnostics">
        <span class="hud-sep">|</span>
        <span><span id="center-lat">--</span>, <span id="center-lon">--</span></span>
        <span class="hud-sep">|</span>
        <span>Alt: <span id="camera-alt">--</span></span>
      </span>
    </div>
  </div>
  <div id="throttle-warning" class="hidden">API rate limited — displaying last known positions</div>

  <div id="hud-instructions">
    <div>Ctrl + drag to change perspective.</div>
    <div>Scroll to zoom, drag to pan.</div>
  </div>

  <!-- Bottom sheet: timeline stacks above controls on mobile -->
  <div id="bottom-sheet">
    <!-- Flight plan timeline scrubber -->
    <div id="timeline-panel" class="hidden">
      <div id="timeline-bar">
        <span id="timeline-origin" class="timeline-airport">---</span>
        <div id="timeline-track">
          <span id="timeline-dot-origin" class="timeline-delay-dot"></span>
          <input type="range" id="timeline-slider" min="0" max="1000" value="500" title="Flight plan timeline scrubber" aria-label="Flight plan timeline scrubber">
          <span id="timeline-dot-dest" class="timeline-delay-dot"></span>
        </div>
        <span id="timeline-dest" class="timeline-airport">---</span>
        <span id="origin-weather" class="timeline-weather"></span>
        <span id="timeline-time">NOW</span>
        <span id="dest-weather" class="timeline-weather"></span>
      </div>
      <div id="timeline-info">
        <button id="timeline-live" class="scope-btn timeline-live-btn">Live</button>
      </div>
    </div>

    <!-- Controls panel -->
    <div id="controls">
      <div class="sheet-handle"></div>
      <div class="control-group">
        <label class="toggle-label">
          <input type="checkbox" id="toggle-aircraft">
          <span>All aircraft</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-labels" checked>
          <span>Data blocks</span>
        </label>
        <span class="map-layer-label-text">Map</span>
        <div class="map-layer-select" id="map-layer">
          <button class="map-layer-btn" type="button">
            <span class="map-layer-label">Gray Canvas</span>
            <svg class="map-layer-chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="map-layer-menu">
            <div class="map-layer-option selected" data-value="esriGray">Gray Canvas</div>
            <div class="map-layer-option" data-value="esriStreet">ESRI Street</div>
            <div class="map-layer-option" data-value="esriTopo">ESRI Topographic</div>
            <div class="map-layer-option" data-value="esriNatGeo">NatGeo</div>
            <div class="map-layer-option" data-value="satellite">Satellite</div>
            <div class="map-layer-option" data-value="vfrHybrid">VFR Sectional</div>
            <div class="map-layer-option" data-value="vfrIfrLow">IFR Low</div>
            <div class="map-layer-option" data-value="vfrIfrHigh">IFR High</div>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label class="toggle-label">
          <input type="checkbox" id="toggle-satellite-ir">
          <span>IR</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-radar">
          <span>Radar</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-sigmets">
          <span>SIGMETs</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-airmets">
          <span>AIRMETs</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-pireps">
          <span>PIREPs</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-turb-forecast">
          <span>GTG</span>
        </label>
      </div>
      <div class="control-group">
        <button id="btn-north" class="scope-btn">North ↑</button>
        <button id="btn-conus" class="scope-btn">CONUS</button>
        <div class="scope-btn-group">
          <button id="btn-2d" class="scope-btn">2D</button>
          <button id="btn-3d" class="scope-btn active">3D</button>
        </div>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-rotate">
          <span>Auto rotate</span>
        </label>

      </div>
    </div>
  </div>

  <!-- Search (hidden until FlightAware availability is confirmed) -->
  <div id="flight-search-wrap" style="display:none">
    <div id="flight-search-bar">
      <input type="text" id="flight-search" placeholder="examples: AAL77, &quot;BOS to LAX&quot;, &quot;to JFK&quot;" autocomplete="off" spellcheck="false">
      <button id="btn-search-history" class="search-history-btn" aria-label="Recent searches" title="Recent searches">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7a6.97 6.97 0 0 1-4.95-2.05l-1.41 1.41A8.97 8.97 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      </button>
    </div>
    <div id="flight-results" class="hidden"></div>
  </div>

  <!-- Selected aircraft info panel -->
  <div id="aircraft-info" class="hidden">
    <button id="info-close" class="scope-btn">&times;</button>
    <div id="info-callsign">---</div>
    <div id="info-collapsible">
      <div id="info-details"></div>
    </div>
    <div id="info-buttons" class="hidden">
      <button id="btn-track" class="scope-btn">Track</button>
      <button id="btn-show-route" class="scope-btn">Show Route</button>
    </div>
    <div class="sheet-handle"></div>
  </div>

  <!-- Module entry point (imports all shared modules + Electron renderer) -->
  <script type="module" src="./entry.js"></script>
</body>
</html>
