<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Flight Radar</title>
  <link rel="stylesheet" href="../vendor/cesium/Build/Cesium/Widgets/widgets.css">
  <style>
    @font-face {
      font-family: 'Roboto Flex';
      font-style: normal;
      font-weight: 100 1000;
      font-display: swap;
      src: url('../shared/fonts/roboto-flex.woff2') format('woff2');
    }
  </style>
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../vendor/cesium/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="hud-stats">
      <span id="clock"></span>
      <span class="hud-sep">|</span>
      <span>Tracks: <span id="track-count">0</span></span>
      <span class="hud-sep">|</span>
      <span>Updated: <span id="last-update">--:--:--</span></span>
      <span class="hud-sep">|</span>
      <span><span id="center-lat">--</span>, <span id="center-lon">--</span></span>
    </div>
  </div>
  <div id="throttle-warning" class="hidden">API rate limited — displaying last known positions</div>

  <div id="hud-instructions">
    <div>Ctrl + drag to change perspective.</div>
    <div>Scroll to zoom, drag to pan.</div>
  </div>

  <!-- Controls panel -->
  <div id="controls">
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-aircraft">
        <span>Aircraft</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-labels" checked disabled>
        <span>Data blocks</span>
      </label>
      <label class="range-label">
        <select id="map-layer">
          <option value="carto">CartoDB</option>
          <option value="satellite">Satellite</option>
          <option value="osm">OpenStreetMap</option>
          <option value="topo">Topographic</option>
          <option value="night">Night Lights</option>
        </select>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-rotate">
        <span>Auto rotate</span>
      </label>
    </div>
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-radar">
        <span>Radar</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-sigmets">
        <span>SIGMETs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-airmets">
        <span>AIRMETs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-pireps">
        <span>PIREPs</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-turb-forecast">
        <span>Turb forecast</span>
      </label>
    </div>
    <div class="control-group">
      <button id="btn-north" class="scope-btn">North up</button>
      <button id="btn-conus" class="scope-btn">CONUS</button>
      <button id="btn-2d" class="scope-btn">2D</button>
      <button id="btn-3d" class="scope-btn active">3D</button>
      <button id="btn-settings" class="scope-btn">Settings</button>
    </div>
  </div>

  <!-- Search panel -->
  <div id="search-panel">
    <input type="text" id="flight-search" placeholder="Flight # (e.g. UAL123)" autocomplete="off" spellcheck="false">
    <button id="btn-flight-search" class="scope-btn">Search</button>
  </div>

  <!-- Selected aircraft info panel -->
  <div id="aircraft-info" class="hidden">
    <div id="info-close">&times;</div>
    <div id="info-callsign">---</div>
    <div id="info-details"></div>
    <button id="btn-fly-route" class="scope-btn hidden">Fly to route</button>
  </div>

  <!-- Shared modules -->
  <script src="../shared/defaults.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/data.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/radar-core.js"></script>
  <script src="../shared/radar-weather.js"></script>
  <script src="../shared/radar-markers.js"></script>
  <script src="../shared/radar-aircraft.js"></script>
  <script src="../shared/radar-ui.js"></script>
  <script src="../shared/radar-flightplan.js"></script>
  <script src="../shared/radar.js"></script>
  <!-- Electron-specific -->
  <script src="renderer.js"></script>
</body>
</html>
