<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Radar - FAA Scope</title>
  <link rel="stylesheet" href="../vendor/cesium/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../vendor/cesium/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- HUD overlay - FAA scope aesthetic -->
  <div id="hud">
    <div id="hud-top">
      <span id="scope-title">FAA SCOPE &#x2022; FLIGHT RADAR</span>
      <span id="clock"></span>
    </div>
    <div id="hud-stats">
      <span>TRKS: <span id="track-count">0</span></span>
      <span>UPD: <span id="last-update">--:--:--</span></span>
      <span>LAT: <span id="center-lat">--</span></span>
      <span>LON: <span id="center-lon">--</span></span>
    </div>
  </div>

  <!-- Controls panel -->
  <div id="controls">
    <div class="control-group">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-trails" checked>
        <span>TRAILS</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-labels" checked>
        <span>DATA BLOCKS</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-granular" checked>
        <span>HI-RES TRAILS</span>
      </label>
    </div>
    <div class="control-group">
      <label class="range-label">
        POLL INTERVAL
        <input type="range" id="poll-interval" min="10" max="60" value="15" step="5">
        <span id="poll-value">15s</span>
      </label>
      <label class="range-label">
        TRAIL LENGTH
        <input type="range" id="trail-length" min="60" max="600" value="300" step="60">
        <span id="trail-value">5m</span>
      </label>
    </div>
    <div class="control-group">
      <button id="btn-boston" class="scope-btn">BOS</button>
      <button id="btn-conus" class="scope-btn">CONUS</button>
      <button id="btn-2d" class="scope-btn active">2D</button>
      <button id="btn-3d" class="scope-btn">3D</button>
    </div>
  </div>

  <!-- Selected aircraft info panel -->
  <div id="aircraft-info" class="hidden">
    <div id="info-close">&times;</div>
    <div id="info-callsign">---</div>
    <div id="info-details"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
